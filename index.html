<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mi UCB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
<style>
/* Layout: mobile-first app — barra inferior al alcance del pulgar en el teléfono; en pantallas anchas pasa a riel lateral y el inicio se abre en dos columnas. */
:root {
  --bg: #F0F2F7;
  --surface: #E1E6EF;
  --surface-2: #F8FAFD;
  --fg: #0A1F3C;
  --muted: #465870;
  --line: #B7C6DB;
  --accent: #0B2447;
  --accent-soft: #CCD8EA;
  --on-accent: #FFFFFF;
  --on-accent-2: #C9D3E3;
  --urgent: #A8231B;
  --urgent-soft: #F9E3E1;
  --warn: #744B00;
  --warn-soft: #FBEFD0;
  --ok: #1B6535;
  --ok-soft: #DDF1E3;
  --expo: #7A1FA2;
  --expo-fg: #FFFFFF;
  --scrim: rgba(8, 20, 40, .45);
  --c1: #0B7480; --c2: #A9430E; --c3: #3A7420; --c4: #5A3DAE; --c5: #99195A;

  --font-display: "Roboto Flex", "Roboto", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Roboto Flex", "Roboto", "Segoe UI", system-ui, -apple-system, sans-serif;

  --t-label: 13px; --t-small: 14px; --t-body: 16px; --t-lead: 18px;
  --t-h3: 20px; --t-h2: 20px; --t-h1: 30px; --t-glance: 34px;
  --r-card: 24px; --r-pill: 999px;
  --nav-h: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1422; --surface: #15243A; --surface-2: #1D304B; --fg: #E6EDF7; --muted: #A8B8CD; --line: #33496A;
    --accent: #9CC3F5; --accent-soft: #223B60; --on-accent: #0A1628; --on-accent-2: #22385A;
    --urgent: #FF9C92; --urgent-soft: #3B1C1A; --warn: #F1C56E; --warn-soft: #33290F; --ok: #85D6A0; --ok-soft: #143022;
    --expo: #DDA3F5; --expo-fg: #1E0F27; --scrim: rgba(0, 0, 0, .6);
    --c1: #5CC7D2; --c2: #F29B6B; --c3: #92CF6E; --c4: #B4A0F5; --c5: #F08DBE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1422; --surface: #15243A; --surface-2: #1D304B; --fg: #E6EDF7; --muted: #A8B8CD; --line: #33496A;
  --accent: #9CC3F5; --accent-soft: #223B60; --on-accent: #0A1628; --on-accent-2: #22385A;
  --urgent: #FF9C92; --urgent-soft: #3B1C1A; --warn: #F1C56E; --warn-soft: #33290F; --ok: #85D6A0; --ok-soft: #143022;
  --expo: #DDA3F5; --expo-fg: #1E0F27; --scrim: rgba(0, 0, 0, .6);
  --c1: #5CC7D2; --c2: #F29B6B; --c3: #92CF6E; --c4: #B4A0F5; --c5: #F08DBE;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[data-h] { position: relative; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: var(--t-body); line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 700; line-height: 1.2; text-wrap: balance; color: var(--fg); }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Franja del prototipo */
.proto-bar {
  display: flex; flex-wrap: nowrap; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 16px; white-space: nowrap; background: var(--surface-2); color: var(--muted); font-size: var(--t-label);
}
.expo-switch { display: inline-flex; align-items: center; gap: 10px; min-height: 40px; cursor: pointer; color: var(--fg); font-weight: 700; }
.expo-switch input { appearance: none; width: 40px; height: 24px; border-radius: var(--r-pill); background: var(--line); position: relative; margin: 0; cursor: pointer; transition: background .2s; }
.expo-switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.expo-switch input:checked { background: var(--expo); }
.expo-switch input:checked::after { transform: translateX(16px); }

/* Barra superior */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 4px 8px 4px 16px; background: var(--bg); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.brand-mark {
  width: 40px; height: 40px; border-radius: 10px; background: #0B2447; display: grid; place-items: center;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
}
.brand-mark img, .login-mark img { display: block; width: 74%; height: auto; }
.brand-name { font: 700 19px/1 var(--font-display); }
.top-actions { display: flex; align-items: center; gap: 4px; }
.iconbtn { position: relative; width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; color: var(--fg); }
.iconbtn:hover { background: var(--surface-2); }
.count {
  position: absolute; top: 6px; right: -1px; min-width: 16px; height: 16px; padding: 0 3px; border-radius: var(--r-pill);
  background: var(--urgent); color: var(--surface); font: 700 10px/16px var(--font-body); text-align: center;
  border: 2px solid var(--bg); box-sizing: content-box;
}
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 700 14px/1 var(--font-body); }

/* Estructura */
.shell { display: block; }
main { padding: 20px 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); max-width: 720px; margin: 0 auto; }
main:focus { outline: none; }

/* Navegación principal */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 4px 4px env(safe-area-inset-bottom, 0px); background: var(--surface); border-top: 1px solid var(--line);
}
.nav a {
  min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--muted); font-size: var(--t-label); font-weight: 700; border-radius: 12px;
}
.nav a .nav-ic { width: 56px; height: 30px; border-radius: var(--r-pill); display: grid; place-items: center; transition: background .2s; }
.nav a[aria-current="page"] { color: var(--accent); }
.nav a[aria-current="page"] .nav-ic { background: var(--accent-soft); }

/* Bloques */
.hoy { display: grid; gap: 28px; }
.col { display: grid; gap: 28px; align-content: start; min-width: 0; }
.block { position: relative; display: grid; gap: 12px; min-width: 0; }
.block-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.block-head h2 { font-size: var(--t-h2); }
.more { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 4px 0 8px; color: var(--accent); font-weight: 700; font-size: var(--t-small); border-radius: 10px; }
.more:hover { background: var(--accent-soft); }

.hello { position: relative; display: grid; gap: 4px; }
.hello .date { color: var(--muted); font-size: var(--t-small); font-weight: 700; letter-spacing: .02em; }
.hello h1 { font-size: var(--t-h1); }
.hello .summary { font-size: var(--t-lead); color: var(--fg); margin-top: 4px; }
.hello .summary b { color: var(--accent); }

.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.list { overflow: hidden; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.course { display: flex; align-items: flex-start; gap: 8px; color: var(--muted); font-size: var(--t-small); min-width: 0; line-height: 1.35; }
.course .dot { margin-top: 5px; }
.course span:last-child { min-width: 0; }

/* Próxima clase */
.class-card { padding: 18px; display: grid; gap: 10px; }
.class-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.time-big { font: 700 var(--t-glance)/1 var(--font-display); }
.rel { font-size: var(--t-small); font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: var(--r-pill); }
.class-card h3 { font-size: 22px; }
.meta { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; color: var(--muted); font-size: 15px; }
.meta li { display: flex; align-items: center; gap: 8px; }
.meta li strong { color: var(--fg); }
.after { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: var(--t-small); padding: 0 4px; }
.after b { color: var(--fg); }

/* Filas de entregas y notas */
.row {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) 20px; gap: 14px; align-items: center;
  padding: 14px 12px 14px 16px; min-height: 72px; width: 100%; text-align: left;
}
.row + .row { border-top: 1px solid var(--line); }
.row:hover { background: var(--surface-2); }
.date-box { text-align: center; line-height: 1.1; }
.date-box .d { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.date-box .n { display: block; font: 700 24px/1.1 var(--font-display); }
.date-box .h { display: block; font-size: 12px; color: var(--muted); }
.row-body { display: grid; gap: 4px; min-width: 0; }
.row-title { font-weight: 700; line-height: 1.3; }
.chev { color: var(--muted); }
.pill { justify-self: start; display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-label); font-weight: 700; padding: 3px 10px; border-radius: var(--r-pill); }
.pill.urgent { color: var(--urgent); background: var(--urgent-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.neutral { color: var(--muted); background: var(--surface-2); }

.grade-row { grid-template-columns: minmax(0, 1fr) auto 20px; }
.score { text-align: right; white-space: nowrap; }
.score b { font: 700 30px/1 var(--font-display); }
.score span { color: var(--muted); font-size: var(--t-small); margin-left: 2px; }
.row-sub { color: var(--muted); font-size: var(--t-label); }

/* Pago */
.pay-card { padding: 18px; display: grid; gap: 10px; }
.eyebrow { font-size: var(--t-label); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.amount { font: 700 var(--t-glance)/1.05 var(--font-display); }
.btn-row { display: grid; gap: 8px; margin-top: 6px; }
.btn { min-height: 48px; border-radius: 12px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { color: var(--accent); }
.btn-ghost:hover { background: var(--accent-soft); }

/* Accesos rápidos */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile {
  position: relative; display: grid; gap: 6px; align-content: start; padding: 14px; min-height: 96px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
.tile:hover { border-color: var(--accent); }
.hwrap { position: relative; display: grid; }
.top-actions .hwrap { display: block; }
.tile .ic { color: var(--accent); }
.tile b { font-size: 15px; line-height: 1.25; }
.tile span { font-size: var(--t-label); color: var(--muted); line-height: 1.3; }

/* Avisos */
.notice { display: grid; gap: 4px; padding: 16px; }
.notice + .notice { border-top: 1px solid var(--line); }
.notice .tag { font-size: var(--t-label); color: var(--muted); font-weight: 700; }
.notice h3 { font: 700 17px/1.3 var(--font-body); }
.notice p { font-size: 15px; color: var(--muted); }
.notice .more { justify-self: start; margin-left: -8px; }

/* Pantallas en construcción */
.wip { display: grid; gap: 16px; }
.wip h1 { font-size: var(--t-h1); }
.wip .card { padding: 18px; display: grid; gap: 10px; }
.wip ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: var(--t-label); font-weight: 700; padding: 6px 12px; min-height: 32px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--fg); }

/* Hoja inferior */
.backdrop { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 82vh; overflow: auto; background: var(--surface); color: var(--fg);
  border-radius: 20px 20px 0 0; padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 6px auto 12px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.sheet-head h2 { font-size: 22px; }
.sheet-head .iconbtn { flex: none; }
.sheet-list { display: grid; }
.sheet-item { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px 4px; min-height: 64px; text-align: left; width: 100%; border-radius: 10px; }
.sheet-item + .sheet-item { border-top: 1px solid var(--line); }
.sheet-item:hover { background: var(--surface-2); }
.sheet-item .ic-wrap { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.sheet-item .ic-wrap.urgent { background: var(--urgent-soft); color: var(--urgent); }
.sheet-item .ic-wrap.warn { background: var(--warn-soft); color: var(--warn); }
.sheet-item b { display: block; line-height: 1.35; }
.sheet-item small { color: var(--muted); font-size: var(--t-label); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 4px 4px; border-top: 1px solid var(--line); margin-top: 8px; }
.setting p { font-size: var(--t-small); color: var(--muted); }
.setting b { display: block; color: var(--fg); font-size: var(--t-body); }
.finding { display: grid; gap: 8px; padding: 14px 0; }
.finding + .finding { border-top: 1px solid var(--line); }
.finding-code { justify-self: start; font-size: var(--t-label); font-weight: 700; padding: 3px 10px; border-radius: var(--r-pill); background: var(--expo); color: var(--expo-fg); }
.finding h3 { font: 700 17px/1.3 var(--font-body); }
.finding dl { margin: 0; display: grid; gap: 6px; }
.finding dt { font-size: var(--t-label); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.finding dd { margin: 0 0 4px; font-size: 15px; }

/* Aviso breve */
.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  max-width: 480px; margin: 0 auto; padding: 14px 16px; border-radius: 14px;
  background: var(--fg); color: var(--bg); font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.2);
}

/* Modo exposición */
.hbadge {
  position: absolute; top: -12px; right: 10px; z-index: 6;
  display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 3px 10px;
  border-radius: var(--r-pill); background: var(--expo); color: var(--expo-fg);
  font: 700 12px/1 var(--font-body); letter-spacing: .02em; border: 2px solid var(--bg); white-space: nowrap;
}
body.expo [data-h] { outline: 2px dashed var(--expo); outline-offset: 5px; border-radius: 14px; }
body.expo .nav .hbadge { top: -16px; right: 12px; }
body.expo .top-actions .hbadge { top: -6px; right: -6px; padding: 3px 7px; }

/* Cursos, curso y tarea */
.page-head { display: grid; gap: 6px; }
.page-head h1 { font-size: 28px; }
.sub { color: var(--muted); font-size: 15px; }
.back { justify-self: start; display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin-left: -8px; padding: 0 10px 0 4px; color: var(--accent); font-weight: 700; font-size: var(--t-small); border-radius: 10px; }
.back svg { transform: scaleX(-1); }
.back:hover { background: var(--accent-soft); }
.sigla { display: inline-flex; align-items: center; gap: 8px; font-size: var(--t-label); font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.stack { display: grid; gap: 24px; }
.narrow { max-width: 720px; }
.block { scroll-margin-top: 90px; }
.cursos-grid { position: relative; display: grid; gap: 12px; }
.course-card { display: grid; gap: 10px; padding: 16px 18px; }
.course-card:hover { border-color: var(--accent); }
.course-card h2 { font-size: 20px; }
.course-card { gap: 6px; }
.course-count { font-size: var(--t-small); font-weight: 700; color: var(--accent); }
.course-foot { display: grid; gap: 6px; }
.bar { height: 8px; border-radius: var(--r-pill); background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.bar.done > span { background: var(--ok); }
.progress-line { display: flex; justify-content: space-between; gap: 12px; font-size: var(--t-label); color: var(--muted); }
.progress-line b { color: var(--fg); font-weight: 700; }
.seg-wrap { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); z-index: 10; }
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 14px; }
.seg button { min-height: 44px; border-radius: 10px; font-size: var(--t-small); font-weight: 700; color: var(--muted); padding: 0 4px; white-space: nowrap; }
.seg.four { grid-template-columns: 1.3fr 1.05fr .8fr 1.12fr; }
.seg.four { gap: 6px; }
.seg.four button { padding: 0 2px; font-size: 13.5px; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.pad { padding: 18px; display: grid; gap: 12px; }
.pad h2 { font-size: var(--t-h2); }
.file-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px 12px 16px; min-height: 64px; width: 100%; text-align: left; }
.file-row + .file-row { border-top: 1px solid var(--line); }
.file-ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.file-name { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.file-meta { display: block; font-size: var(--t-label); color: var(--muted); }
.btn-sm { min-height: 44px; padding: 0 14px; border-radius: 10px; font-weight: 700; font-size: var(--t-small); color: var(--accent); }
.btn-sm:hover { background: var(--accent-soft); }
.btn-secondary { background: var(--surface-2); color: var(--fg); }
.btn-secondary:hover { filter: brightness(.97); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .55; cursor: not-allowed; filter: none; }
.btn-stack { display: grid; gap: 10px; }
.btn-stack .apart { margin-top: 14px; }
.hint { font-size: var(--t-label); color: var(--muted); text-align: center; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; margin: 0; font-size: 15px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 700; min-width: 0; }
.due { display: grid; gap: 4px; }
.due strong { font: 700 22px/1.25 var(--font-display); }
.due span { color: var(--muted); font-size: 15px; }
.banner { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; padding: 14px 16px; border-radius: 14px; font-size: 15px; line-height: 1.4; }
.banner.warn { background: var(--warn-soft); }
.banner.warn svg { color: var(--warn); }
.banner.info { background: var(--accent-soft); }
.banner.info svg { color: var(--accent); }
.review { border: 2px solid var(--accent); }
.receipt { justify-items: center; text-align: center; }
.receipt .kv { justify-self: stretch; text-align: left; background: var(--surface-2); padding: 14px 16px; border-radius: 12px; }
.big-check { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); }
.rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.rule { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.rule b { font: 700 20px/1.2 var(--font-display); }
.rule span { font-size: var(--t-label); color: var(--muted); }
.unit { display: grid; gap: 8px; padding: 16px; width: 100%; text-align: left; }
.unit + .unit { border-top: 1px solid var(--line); }
.unit:hover { background: var(--surface-2); }
.unit-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.unit b { font-size: 17px; line-height: 1.3; }
.empty { padding: 18px; color: var(--muted); font-size: 15px; }
.big-score { display: flex; align-items: baseline; gap: 6px; }
.big-score b { font: 700 44px/1 var(--font-display); white-space: nowrap; }
.big-score span { font-size: var(--t-lead); color: var(--muted); }

/* Notas, calendario y trámites */
.sbar { display: flex; height: 10px; border-radius: var(--r-pill); overflow: hidden; background: var(--surface-2); }
.sbar .s-ok { background: var(--accent); }
.sbar .s-lost { background: var(--muted); opacity: .45; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--t-label); color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.eval { display: grid; gap: 8px; padding: 16px; }
.eval + .eval { border-top: 1px solid var(--line); }
.eval-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 4px 10px; }
.eval-top b { font-size: 17px; line-height: 1.3; }
.eval-score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.eval-score b { font: 700 30px/1 var(--font-display); }
.eval-score span { color: var(--muted); font-size: var(--t-small); }
.comment { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 15px; display: grid; gap: 2px; }
.comment small { color: var(--muted); font-size: var(--t-label); font-weight: 700; }
.pill.official { color: var(--ok); background: var(--ok-soft); }
.pill.prov { color: var(--warn); background: var(--warn-soft); }
.fold summary { list-style: none; min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; font-weight: 700; cursor: pointer; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary > svg { flex: none; transition: transform .2s; transform: rotate(90deg); }
.fold[open] summary > svg { transform: rotate(-90deg); }
.fold[open] summary { border-bottom: 1px solid var(--line); }
.plain-row { display: grid; gap: 4px; padding: 14px 16px; }
.plain-row + .plain-row { border-top: 1px solid var(--line); }
.plain-row .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filter { min-height: 44px; padding: 0 10px; white-space: nowrap; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface); font-size: var(--t-label); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.filter[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.day-head { font: 700 var(--t-small)/1.3 var(--font-body); color: var(--muted); letter-spacing: .02em; padding: 4px 2px 0; }
.day-head.soon { color: var(--urgent); }
.ev-row { grid-template-columns: 60px minmax(0, 1fr) 20px; }
.ev-time { font: 700 18px/1.1 var(--font-display); text-align: center; }
.ev-time.small { font: 700 12px/1.2 var(--font-body); color: var(--muted); }
.type { display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-label); font-weight: 700; }
.type.entrega { color: var(--accent); }
.type.examen { color: var(--c4); }
.type.pago { color: var(--warn); }
.seg.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.seg.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cls-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding: 16px; align-items: start; }
.cls-row + .cls-row { border-top: 1px solid var(--line); }
.cls-row.past { opacity: .6; }
.cls-row.next { background: var(--accent-soft); }
.cls-time b { display: block; font: 700 20px/1.1 var(--font-display); }
.cls-time span { font-size: var(--t-label); color: var(--muted); }
.act-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 20px; gap: 12px; align-items: center; padding: 14px 12px 14px 16px; min-height: 72px; width: 100%; text-align: left; }
.act-row + .act-row { border-top: 1px solid var(--line); }
.act-row:hover { background: var(--surface-2); }
.act-row small { display: block; font-size: var(--t-label); color: var(--muted); line-height: 1.35; }
.pick-row { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; align-items: center; min-height: 56px; padding: 8px 4px; cursor: pointer; border-radius: 10px; }
.pick-row + .pick-row { border-top: 1px solid var(--line); }
.pick-row input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.total b { font: 700 28px/1 var(--font-display); }
.qr-box { justify-self: center; background: #FFFFFF; padding: 14px; border-radius: 14px; border: 1px solid var(--line); line-height: 0; }

/* Ingreso y carnet */
body.login .topbar, body.login .nav { display: none; }
body.login .shell { display: block; max-width: none; }
body.login main { max-width: none; padding-inline: 16px; }
body.login main { padding-bottom: 32px; }
.login-wrap { min-height: calc(100vh - 80px); max-width: 420px; margin: 0 auto; display: grid; align-content: center; justify-items: center; gap: 22px; text-align: center; padding-block: 24px; }
.login-mark { width: 96px; height: 96px; border-radius: 24px; background: #0B2447; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); display: grid; place-items: center; font: 700 20px/1 var(--font-display); letter-spacing: .06em; }
.login-wrap h1 { font-size: 34px; }
.login-wrap .lead { font-size: var(--t-lead); color: var(--muted); max-width: 30ch; }
.login-card { justify-self: stretch; display: grid; gap: 12px; padding: 20px; text-align: left; }
.login-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 15px; }
.login-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; }
.login-list svg { color: var(--ok); margin-top: 2px; }
.g-mark { width: 26px; height: 26px; border-radius: 50%; background: var(--on-accent); color: var(--accent); display: grid; place-items: center; font: 700 15px/1 var(--font-body); }
.idcard { background: var(--accent); color: var(--on-accent); border-radius: 20px; padding: 20px; display: grid; gap: 16px; }
.id-top { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: center; }
.id-photo { width: 72px; height: 72px; border-radius: 16px; background: var(--on-accent); color: var(--accent); display: grid; place-items: center; font: 700 24px/1 var(--font-display); }
.idcard h2 { font-size: 21px; color: var(--on-accent); }
.idcard p { font-size: 15px; opacity: .9; }
.id-ok { justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: var(--r-pill); background: var(--on-accent); color: var(--accent); font-size: var(--t-label); font-weight: 700; }
.idcard .qr-box { border: 0; padding: 16px; }
.id-code { text-align: center; font-size: 15px; letter-spacing: .08em; }
.ci-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* Revisión del prototipo */
.sum-link { color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.exam-row { grid-template-columns: 60px minmax(0, 1fr); }
.cal-add { justify-self: start; width: fit-content; max-width: 100%; white-space: nowrap; border: 1px solid var(--line); margin-top: 4px; display: inline-flex; align-items: center; gap: 6px; }
.cal-add[aria-pressed="true"] { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.doc-prev { background: #FFFFFF; color: #1A1A1A; border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 9px; }
.doc-prev b { font-size: 15px; margin-bottom: 4px; }
.doc-prev span { height: 7px; border-radius: 4px; background: #D9DEE5; }
.field { width: 100%; min-height: 100px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); font: inherit; font-size: 16px; resize: vertical; }

/* Estilo visual de la app institucional: azul marino, tarjetas tintadas, contornos y selección sólida */
.card { border: 0; }
.btn { border-radius: 16px; }
.btn-secondary { background: transparent; color: var(--accent); border: 1.5px solid var(--line); }
.btn-secondary:hover { background: var(--accent-soft); filter: none; }
.iconbtn.round { border-radius: 50%; background: var(--surface); width: 46px; height: 46px; }
.top-actions { gap: 8px; }
.avatar { background: var(--accent); color: var(--on-accent); }
.eyebrow { color: var(--muted); letter-spacing: .08em; }
.kv dt { font-weight: 400; }
.kv dd { text-align: right; }
.kv.left dd { text-align: left; }
.seg-wrap { background: var(--bg); padding-block: 6px; }
.seg { background: transparent; padding: 0; gap: 8px; }
.seg button { background: var(--surface); border-radius: 16px; min-height: 48px; color: var(--accent); }
.seg button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.filter { background: var(--surface); border-color: transparent; color: var(--accent); }
.filter[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.nav { border-top: 0; background: var(--surface); }
.nav a { color: var(--accent); }
.nav a[aria-current="page"] .nav-ic { background: var(--accent); color: var(--on-accent); }
.class-card { background: var(--accent); color: var(--on-accent); }
.class-card h3, .class-card .meta, .class-card .meta li strong { color: var(--on-accent); }
.class-card .rel { background: color-mix(in srgb, var(--on-accent) 16%, transparent); color: var(--on-accent); }
.class-card .eyebrow { color: var(--on-accent); opacity: .85; }
.tiles { grid-template-columns: 1fr; gap: 10px; background: var(--surface); border-radius: var(--r-card); padding: 12px; }
.tile { grid-template-columns: 32px minmax(0, 1fr); column-gap: 14px; row-gap: 0; align-items: center; min-height: 64px; padding: 10px 16px; background: transparent; border: 1.5px solid var(--line); border-radius: 16px; }
.tile .ic { grid-row: 1 / span 2; color: var(--accent); }
.tile b, .tile > span:not(.ic) { grid-column: 2; }
.tile b { font-size: 17px; color: var(--accent); }
.actions { display: grid; gap: 10px; padding: 12px; }
.actions .act-row { border: 1.5px solid var(--line); border-radius: 16px; }
.actions .act-row + .act-row { border-top: 1.5px solid var(--line); }
.timeline { position: relative; display: grid; gap: 16px; padding-left: 30px; }
.timeline::before { content: ""; position: absolute; left: 9px; top: 14px; bottom: 14px; width: 2px; background: var(--line); }
.tl-item { position: relative; display: grid; gap: 4px; background: var(--surface); border-radius: var(--r-card); padding: 16px 18px; }
.tl-item::before { content: ""; position: absolute; left: -29px; top: 18px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); border: 3px solid var(--bg); }
.tl-item.next { background: var(--accent); color: var(--on-accent); }
.tl-item.next::before { background: var(--accent); }
.tl-item.past { background: transparent; border: 1.5px dashed var(--line); }
.tl-item.past::before { background: var(--line); }
.tl-time { font-weight: 700; font-size: 17px; }
.tl-name { font-size: 20px; line-height: 1.25; }
.tl-meta { font-size: 15px; color: var(--muted); }
.tl-meta b { color: var(--fg); }
.tl-item.next .eyebrow, .tl-item.next .tl-meta, .tl-item.next .tl-meta b { color: var(--on-accent); }
.tl-badge { justify-self: start; font-size: var(--t-label); font-weight: 700; padding: 3px 10px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--on-accent) 16%, transparent); }
.tl-note { font-size: var(--t-label); color: var(--muted); }

/* Pasada de diseño (frontend-design) */
h1, h2, .dp-time, .date-box .n, .score b, .amount, .eval-score b, .big-score b, .rule b, .tl-time, .time-big {
  font-variation-settings: "wdth" 82;
}
h1 { font-weight: 800; letter-spacing: -.01em; }
h2 { font-weight: 750; }
.eyebrow { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: var(--t-small); }
.date-box .d { letter-spacing: 0; font-size: 13px; }
.date-box .n, .score b, .amount, .eval-score b { font-weight: 800; font-variation-settings: "wdth" 70; }
.pill { background: none !important; padding: 0; border-radius: 0; gap: 6px; font-size: var(--t-small); }
.pill.neutral { color: var(--muted); }
.card.pay-card .pill, .row-body .pill { margin-top: 2px; }
.hello .summary { font-size: var(--t-lead); }
.sum-link { text-decoration-thickness: 1.5px; }
.day-panel { background: var(--accent); color: var(--on-accent); border-radius: var(--r-card); padding: 18px 20px 16px; display: grid; gap: 6px; }
.day-panel h2, .day-panel h3 { color: var(--on-accent); }
.dp-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dp-head h2 { font-size: 16px; font-weight: 600; font-variation-settings: "wdth" 100; }
.dp-link { display: inline-flex; align-items: center; min-height: 44px; padding: 0 2px 0 10px; font-weight: 700; font-size: var(--t-small); color: var(--on-accent); }
.dp-time { font: 800 64px/0.95 var(--font-display); font-variation-settings: "wdth" 62; letter-spacing: -.01em; margin-top: 2px; }
.dp-name { font-size: 24px; font-weight: 750; }
.dp-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 15px; }
.dp-meta span { flex-basis: 100%; padding-left: 26px; color: var(--on-accent-2); }
.dp-after { font-size: 14px; color: var(--on-accent-2); }
.dr { margin: 30px 0 4px; }
.dr-track { position: relative; height: 16px; border-radius: 4px; background: color-mix(in srgb, var(--on-accent) 12%, var(--accent)); }
.dr-block { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: color-mix(in srgb, var(--on-accent) 45%, var(--accent)); }
.dr-block.past { background: color-mix(in srgb, var(--on-accent) 22%, var(--accent)); }
.dr-block.next { background: var(--on-accent); }
.dr-now { position: absolute; top: -8px; bottom: -8px; width: 2px; margin-left: -1px; background: #F2B33D; }
.dr-now span { position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--on-accent); }
.dr-ticks { position: relative; height: 18px; margin-top: 8px; }
.dr-tick { position: absolute; transform: translateX(-50%); font-size: 12px; color: var(--on-accent-2); }
.g-state { font-size: 17px; }
.g-state.ok b { color: var(--ok); }
.g-state.warn b { color: var(--warn); }
.g-state.urgent b { color: var(--urgent); }
.scale { position: relative; padding-bottom: 22px; margin-top: 4px; }
.scale .sbar { height: 12px; border-radius: 3px; }
.pass { position: absolute; top: -5px; height: 22px; width: 2px; margin-left: -1px; background: var(--fg); }
.scale-labels { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; font-size: 12px; color: var(--muted); }
.scale-labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.scale-labels span:first-child { transform: none; }
.scale-labels span:last-child { transform: translateX(-100%); }
.scale-labels .p51 { color: var(--fg); font-weight: 700; }

/* Asistencia */
.as-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(14px, 1fr)); gap: 4px; }
.as-cell { aspect-ratio: 1; border-radius: 3px; background: var(--accent); }
.as-cell.tarde { background: var(--warn); }
.as-cell.falta { background: var(--urgent); }
.as-cell.just { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
.as-key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--accent); }
.as-key.tarde { background: var(--warn); }
.as-key.falta { background: var(--urgent); }
.as-key.just { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
.as-row { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 14px 16px; align-items: start; }
.as-row + .as-row { border-top: 1px solid var(--line); }
.fold .as-row:first-of-type { border-top: 0; }
.as-ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--on-accent); background: var(--accent); }
.as-ic.tarde { background: var(--warn); }
.as-ic.falta { background: var(--urgent); }
.as-ic.just { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.as-state { font-size: var(--t-small); font-weight: 700; color: var(--fg); }
.as-state.tarde { color: var(--warn); }
.as-state.falta { color: var(--urgent); }
.as-just { justify-self: start; margin-left: -10px; }

/* Perfil */
.pf-head { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: start; }
.pf-head .id-photo { width: 56px; height: 56px; border-radius: 14px; font-size: 20px; margin-top: 4px; }
.pf-head .id-photo { background: var(--accent); color: var(--on-accent); }
.pf-head h1 { font-size: 26px; }
.pf-kv { grid-template-columns: minmax(0, 1fr); gap: 2px; }
.pf-kv dt { margin-top: 10px; font-size: var(--t-small); }
.pf-kv dt:first-child { margin-top: 0; }
.pf-kv dd { text-align: left; overflow-wrap: anywhere; }
.fld { display: grid; gap: 6px; font-weight: 700; font-size: var(--t-small); color: var(--fg); }
.input { width: 100%; min-height: 48px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--fg); font: 400 16px/1.3 var(--font-body); }
.input:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
.fld-err { color: var(--urgent); font-size: var(--t-small); font-weight: 700; }

/* Preferencias de avisos */
.switch { appearance: none; flex: none; width: 52px; height: 32px; border-radius: var(--r-pill); background: var(--line); position: relative; margin: 0; cursor: pointer; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .2s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(20px); background: var(--on-accent); }
.switch:disabled { cursor: not-allowed; opacity: .45; }
.pref-list.off { opacity: .6; }
.switch:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.pref-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; padding: 12px 4px; cursor: pointer; }
.pref-row + .pref-row { border-top: 1px solid var(--line); }
.pref-row b { display: block; line-height: 1.3; }
.pref-row small { display: block; color: var(--muted); font-size: var(--t-small); line-height: 1.35; margin-top: 2px; }
.pref-row.master { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; }
.pref-list.off .pref-row { cursor: not-allowed; }
.pref-list.off .pref-row b, .pref-list.off .pref-row small { color: var(--muted); }

/* Biblioteca */
.search { position: relative; display: block; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .input { padding-left: 44px; }

/* Competencias */
.comp summary { min-height: 76px; padding: 12px 16px; gap: 12px; }
.comp-head { display: grid; gap: 2px; flex: 1; min-width: 0; }
.comp-head b { font-size: 17px; }
.comp-head .pill { margin-top: 2px; }
.comp-head .row-sub { font-weight: 400; }
.comp-score { display: grid; justify-items: end; line-height: 1.1; white-space: nowrap; }
.comp-score b { font: 800 26px/1 var(--font-display); font-variation-settings: "wdth" 70; }
.comp-score span { font-size: var(--t-small); color: var(--muted); }
.comp-note { padding: 12px 16px 0; font-size: var(--t-small); color: var(--muted); }
.comp .eval, .comp .plain-row { border-top: 1px solid var(--line); }
.fold.comp[open] summary { border-bottom: 0; }
.comp .comp-note + .eval { border-top: 0; }

/* Ingreso con credenciales */
.login-sep { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: var(--t-small); }
.login-sep::before, .login-sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.pw { position: relative; display: block; }
.pw .input { padding-right: 52px; }
.pw-toggle { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); border-radius: 10px; }
.pw-toggle:hover { background: var(--surface-2); }

/* Carga e inscripción */
.skel { height: 20px; border-radius: 8px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: skel 1.2s ease-in-out infinite; }
@keyframes skel { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.pick-row.off { cursor: not-allowed; }
.pick-row.off b { color: var(--muted); }
.insc-list { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15px; }

@media (min-width: 960px) {
  .cursos-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 8px; max-width: 1240px; margin: 0 auto; }
  .nav {
    position: sticky; top: 80px; align-self: start; z-index: 5;
    display: grid; grid-template-columns: 1fr; gap: 4px; padding: 20px 12px; background: transparent; border: 0;
  }
  .nav a { flex-direction: row; justify-content: flex-start; gap: 10px; min-height: 52px; padding: 0 12px; font-size: 16px; }
  .nav a .nav-ic { width: 40px; height: 36px; }
  .nav a[aria-current="page"] { background: var(--accent-soft); }
  .nav a[aria-current="page"] .nav-ic { background: transparent; }
  main { max-width: none; padding: 28px 24px 48px; }
  .hoy { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); column-gap: 32px; }
  .hello { grid-column: 1 / -1; }
  .hello h1 { font-size: 36px; }
  .toast { bottom: 24px; }
  .backdrop { align-items: center; }
  .sheet { border-radius: 20px; max-height: 80vh; }
  .btn-row { grid-template-columns: auto auto; justify-content: start; }
  .col .btn-row { grid-template-columns: 1fr; }
  body.expo .nav .hbadge { top: 0; right: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

/* ---------- Plantillas ---------- */
const dot = c => `<span class="dot" style="background:var(--c${c})" aria-hidden="true"></span>`;
const course = c => `<span class="course">${dot(c)}<span>${MATERIAS[c].nombre}</span></span>`;
const pillIc = { urgent: "clock", warn: "clock", ok: "check", neutral: "calendar" };
function estado(id) {
  const t = TAREAS[id], s = st(id);
  if (s.fase === "done") return { cls: "ok", txt: "Entregada hoy" };
  if (t.entregada) return { cls: "ok", txt: t.txt };
  const conHora = (t.est === "urgent" || t.est === "warn") ? ", " + t.hora : "";
  if (s.fase === "draft") return { cls: t.est === "neutral" ? "warn" : t.est, txt: t.txt + conHora + ". Borrador sin entregar" };
  return { cls: t.est, txt: t.txt + conHora };
}
const pill = e => `<span class="pill ${e.cls}">${ic(pillIc[e.cls], 14)}${e.txt}</span>`;
function tareaRow(id, withCourse = true) {
  const t = TAREAS[id];
  return `
    <a class="row" href="#tarea-${id}">
      <span class="date-box num" aria-hidden="true"><span class="d">${t.dia.charAt(0) + t.dia.slice(1).toLowerCase()}</span><span class="n">${t.num}</span><span class="h">${t.hora}</span></span>
      <span class="row-body">
        <span class="row-title">${t.titulo}</span>
        ${withCourse ? course(t.c) : ""}
        ${pill(estado(id))}
      </span>
      <span class="chev">${ic("chev", 20)}</span>
    </a>`;
}
const pendientesDe = c => Object.keys(TAREAS).filter(id => TAREAS[id].c == c);

function dayRuler() {
  const from = 7, to = 19, pos = h => ((h - from) / (to - from) * 100).toFixed(2) + "%";
  const t = x => { const [hh, mm] = x.split(":").map(Number); return hh + mm / 60; };
  const now = 11 + 50 / 60;
  const blocks = HORARIO.mie.map((k, i) => {
    const a = t(k[1]), b = t(k[2]);
    const cls = b <= now ? "past" : (i === 1 ? "next" : "later");
    return `<span class="dr-block ${cls}" style="left:${pos(a)};width:calc(${pos(b)} - ${pos(a)})"></span>`;
  }).join("");
  const ticks = [8, 10, 12, 14, 16, 18].map(h => `<span class="dr-tick num" style="left:${pos(h)}">${h}</span>`).join("");
  return `
    <div class="dr" role="img" aria-label="Tu día: clase de 8:00 a 9:30 ya terminada; son las 11:50; siguen clases de 14:15 a 15:45 y de 16:00 a 17:30.">
      <div class="dr-track">${blocks}<span class="dr-now" style="left:${pos(now)}"><span class="num">11:50</span></span></div>
      <div class="dr-ticks" aria-hidden="true">${ticks}</div>
    </div>`;
}

function viewHoy() {
  const d = HOY;
  const entregas = d.entregas.map(id => tareaRow(id)).join("");
  const urgente = !isDone("t1");
  const secEntregas = `
      <section class="block" aria-labelledby="h-entregas" data-h="L-16,L-13,P-01">
        <div class="block-head"><h2 id="h-entregas">Por entregar</h2><a class="more" href="#calendario">Todas ${ic("chev", 18)}</a></div>
        <div class="card list">${entregas}</div>
      </section>`;

  const notas = d.notas.map(n => `
    <a class="row grade-row" href="#notas">
      <span class="row-body">
        <span class="row-title">${n.titulo}</span>
        ${course(n.c)}
        <span class="row-sub">${n.cuando}</span>
      </span>
      <span class="score num"><b>${n.nota}</b><span>/ ${n.sobre}</span></span>
      <span class="chev">${ic("chev", 20)}</span>
    </a>`).join("");

  const avisos = d.avisos.map((a, i) => `
    <article class="notice">
      <span class="tag">${a.tag}</span>
      <h3>${a.titulo}</h3>
      <p>${a.texto}</p>
      <button class="more" type="button" data-aviso="${i}">Leer más ${ic("chev", 18)}</button>
    </article>`).join("");

  return `
  <div class="hoy">
    <section class="hello" data-h="S-01,S-07">
      <p class="date">${d.fecha}</p>
      <h1 tabindex="-1" id="page-title">Hola, ${d.nombre}</h1>
    </section>

    <div class="col">
      ${urgente ? secEntregas : ""}
      <section class="block" aria-labelledby="h-clase" data-h="S-08">
        <article class="day-panel">
          <div class="dp-head"><h2 id="h-clase">Próxima clase, ${d.clase.rel}</h2><a class="dp-link" href="#horario">Horario ${ic("chev", 18)}</a></div>
          <p class="dp-time num">${d.clase.hora}</p>
          <h3 class="dp-name">${MATERIAS[d.clase.c].nombre}</h3>
          <p class="dp-meta">${ic("pin", 18)}<b>${d.clase.aula}</b><span>hasta las ${d.clase.fin}, con ${d.clase.docente}</span></p>
          ${dayRuler()}
          <p class="dp-after">Después, a las <b class="num">${d.despues.hora}</b>: ${MATERIAS[d.despues.c].nombre}, ${d.despues.aula.replace("Aula", "aula")}.</p>
        </article>
      </section>
      ${urgente ? "" : secEntregas}
    </div>

/* ---------- Asistencia ---------- */
const DIAS_CURSO = { 1: [1, 3], 2: [3, 5], 3: [2, 4], 4: [1, 3], 5: [5] };
const FIN_CLASE = { 1: "09:30", 2: "17:30", 3: "11:30", 4: "15:45", 5: "11:30" };
const INI_CLASE = { 1: "08:00", 2: "16:00", 3: "10:00", 4: "14:15", 5: "10:00" };
const AS_EXC = {
  1: { "2026-08-19": ["tarde"], "2026-09-07": ["falta"], "2026-09-23": ["just", "Viaje de práctica de campo"] },
  2: { "2026-09-11": ["falta"], "2026-09-02": ["tarde"] },
  3: { "2026-08-27": ["just", "Representación de la universidad en un torneo"], "2026-09-15": ["tarde"], "2026-09-22": ["tarde"] },
  4: { "2026-08-31": ["falta"], "2026-09-14": ["falta"], "2026-09-16": ["falta"], "2026-09-28": ["tarde"] },
  5: {}
};
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const DSEM = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
const AS_TXT = { ok: ["Asististe", "check"], tarde: ["Llegaste tarde", "clock"], falta: ["Faltaste", "close"], just: ["Falta justificada", "doc"] };
function asistencia(c) {
  const out = [];
  for (let d = new Date(2026, 7, 3); d <= new Date(2026, 8, 30); d.setDate(d.getDate() + 1)) {
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    if (!DIAS_CURSO[c].includes(d.getDay()) || key === "2026-08-06") continue;
    if (key === "2026-09-30" && FIN_CLASE[c] > "11:50") continue;
    const ex = AS_EXC[c][key];
    out.push({ key, label: `${DSEM[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`, tipo: ex ? ex[0] : "ok", nota: ex ? ex[1] : "" });
  }
  return out.reverse();
}
function viewAsistencia(c) {
  const lista = asistencia(c);
  const n = t => lista.filter(x => x.tipo === t).length;
  const total = lista.length, faltas = n("falta"), presentes = n("ok") + n("tarde");
  const pct = Math.round(presentes / total * 100);
  const permitidas = Math.floor(DIAS_CURSO[c].length * 18 * 0.2);
  const quedan = permitidas - faltas;
  const est = quedan <= 1 ? ["urgent", "En riesgo"] : quedan <= permitidas * 0.6 ? ["warn", "Atención"] : ["ok", "Vas bien"];
  const strip = lista.slice().reverse().map(x => `<span class="as-cell ${x.tipo}" title="${x.label}: ${AS_TXT[x.tipo][0]}"></span>`).join("");
  const excepciones = lista.filter(x => x.tipo !== "ok");
  const fila = x => `
      <div class="as-row">
        <span class="as-ic ${x.tipo}">${ic(AS_TXT[x.tipo][1], 18)}</span>
        <span class="row-body">
          <b>${x.label}</b>
          <span class="row-sub num">${INI_CLASE[c]} a ${FIN_CLASE[c]}</span>
          <span class="as-state ${x.tipo}">${AS_TXT[x.tipo][0]}${x.nota ? ": " + x.nota.charAt(0).toLowerCase() + x.nota.slice(1) : ""}</span>
          ${x.tipo === "falta" ? `<button class="btn-sm as-just" type="button" data-sol="1" data-soltipo="Justificación de una falta" data-solmsg="Solicito justificar mi falta del ${x.label.toLowerCase()} en ${MATERIAS[c].nombre}. Motivo: ">Presentar justificativo</button>` : ""}
        </span>
      </div>`;
  return `
    <section class="block" aria-labelledby="h-as" data-h="S-11,S-09">
      <div class="block-head"><h2 id="h-as">Tu asistencia</h2></div>
      <div class="card pad">
        <p class="g-state ${est[0]} num"><b>${est[1]}</b>: asististe a ${presentes} de ${total} clases (${pct} %).</p>
        <div class="as-strip" role="img" aria-label="Asistencia clase por clase, de la primera a la más reciente: ${n("ok")} asistencias, ${n("tarde")} tardanzas, ${faltas} faltas y ${n("just")} justificadas.">${strip}</div>
        <div class="legend num">
          <span><i class="as-key ok"></i>${n("ok")} asististe</span>
          <span><i class="as-key tarde"></i>${n("tarde")} tarde</span>
          <span><i class="as-key falta"></i>${faltas} ${faltas === 1 ? "falta" : "faltas"}</span>
          <span><i class="as-key just"></i>${n("just")} ${n("just") === 1 ? "justificada" : "justificadas"}</span>
        </div>
        <p class="num" style="font-size:15px">${quedan > 0 ? `Puedes faltar <b>${quedan} ${quedan === 1 ? "vez" : "veces"} más</b> sin bajar del mínimo de esta materia (80 %).` : "<b>Ya llegaste al máximo de faltas.</b> Habla con tu docente."} Las faltas justificadas no cuentan.</p>
      </div>
    </section>
    <section class="block" aria-labelledby="h-asx">
      <div class="block-head"><h2 id="h-asx">Faltas y tardanzas</h2></div>
      <div class="card list">${excepciones.map(fila).join("") || `<p class="empty">Asististe a todas las clases a tiempo.</p>`}</div>
      <details class="card fold">
        <summary><span>Todas las clases (${total})</span>${ic("chev", 20)}</summary>
        ${lista.map(fila).join("")}
      </details>
    </section>`;
}

}

function notaResumen(c) {
  const r = resumenNotas(c);
  const pct = Math.round(r.obt / r.evaluado * 100);
  const falta51 = Math.max(0, 51 - r.obt);
  const est = pct >= 70 ? ["ok", "Vas bien"] : pct >= 51 ? ["warn", "Atención"] : ["urgent", "En riesgo"];
  return `
    <p class="g-state ${est[0]} num"><b>${est[1]}</b>: tienes el ${pct} % de lo evaluado.</p>
    <div class="scale">
      <div class="sbar" role="img" aria-label="${fmt1(r.obt)} puntos obtenidos, ${fmt1(r.perdido)} perdidos y ${r.falta} por evaluar, de 100. Se aprueba con 51.">
        <span class="s-ok" style="width:${r.obt}%"></span><span class="s-lost" style="width:${r.perdido}%"></span>

function viewNotasMateria(c) {
  const m = MATERIAS[c], k = CURSOS[c];
  const evalCard = e => `
    <article class="eval">
      <div class="eval-top"><b>${e.n}</b>${ofPill(e)}</div>
      <div class="eval-score num"><b>${e.nota} / ${e.sobre}</b><span>vale ${e.vale} puntos, aporta ${fmt1(e.nota / e.sobre * e.vale)}</span></div>
      <span class="row-sub">Calificada el ${e.f.toLowerCase()}</span>
      ${e.com ? `<div class="comment"><small>Comentario de ${k.docente}</small>${e.com}</div>` : ""}
    </article>`;
  const pendRow = p => {
    const entregada = p.t && isDone(p.t);
    return `
    <div class="plain-row">
      <div class="top"><b>${p.n}</b>${entregada ? `<span class="pill ok">${ic("check", 14)}Entregada, sin calificar aún</span>` : `<span class="pill neutral">Aún no se evalúa</span>`}</div>
      <span class="row-sub">${/^[A-ZÁÉÍÓÚ][a-záéíóú]+$/.test(p.f) ? `Será en ${p.f.toLowerCase()}, vale ${p.vale} puntos. Todavía no tiene fecha: te avisaremos cuando se publique.` : `${p.f}, vale ${p.vale} puntos`}</span>
    </div>`;
  };
  const evalOf = ec => ec.items.filter(x => x.nota !== undefined).reduce((a, x) => a + x.vale, 0);
  const actual = COMP[c].findIndex((ec, i) => evalOf(ec) < COMP_VALE[i]);
  const comps = COMP[c].map((ec, i) => {
    const hechas = ec.items.filter(x => x.nota !== undefined);
    const obt = hechas.reduce((a, x) => a + x.nota / x.sobre * x.vale, 0);
    const evaluado = hechas.reduce((a, x) => a + x.vale, 0);
    const vale = COMP_VALE[i];
    const cerrada = evaluado === vale;
    const oficial = cerrada && hechas.every(x => x.of);
    const estado = cerrada ? (oficial ? `${ic("check", 14)}Nota oficial` : `${ic("clock", 14)}Provisional, falta registrarla`) : i === actual ? "En curso" : "Aún no empieza";
    const cls = cerrada ? (oficial ? "official" : "prov") : "neutral";
    const abierta = i === actual;
    return `
    <details class="card fold comp" ${abierta ? "open" : ""}>
      <summary>
        <span class="comp-head">
          <b>Competencia ${i + 1}</b>
          <span class="row-sub">${ec.cierre}</span>
          <span class="pill ${cls}">${estado}</span>
        </span>
        <span class="comp-score num">${evaluado ? `<b>${fmt1(obt)}</b>` : `<b>–</b>`}<span>de ${vale}</span></span>
        ${ic("chev", 20)}
      </summary>
      ${!cerrada && evaluado ? `<p class="comp-note num">${evaluado} de ${vale} puntos evaluados hasta ahora.</p>` : ""}
      ${hechas.sort((a, b) => b.d.localeCompare(a.d)).map(evalCard).join("")}
      ${ec.items.filter(x => x.nota === undefined).map(pendRow).join("")}
    </details>`;
  }).join("");
  return `
  <div class="stack narrow">
    <div class="page-head">
      <a class="back" href="#notas">${ic("chev", 18)}Mis notas</a>
      <span class="sigla">${dot(c)}${m.sigla}</span>
      <h1 tabindex="-1" id="page-title">${m.nombre}</h1>
      <p class="sub">${k.docente}</p>
    </div>
    <div class="card pad">${notaResumen(c)}</div>
    <section class="block" aria-labelledby="h-comp" data-h="L-22,L-21,L-11,S-13">
      <div class="block-head"><h2 id="h-comp">Por competencia</h2></div>
      ${comps}
    </section>
  </div>`;
}

/* ---------- Pago y abandono (hoja inferior) ---------- */
function qrSvg(s0 = 7, size = 184, label = "Código QR de ejemplo") {
  let seed = s0, r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280, cells = "";
  const n = 25, finder = (x, y) => (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!finder(x, y) && r() > .5) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;

let biblioQ = "";
function biblioRow(r) {
  return `
    <button class="file-row" type="button" data-biblio="${esc(r.n)}" aria-label="${esc(r.n)}: ${esc(r.d)}. Abre otro sitio.">
      <span class="file-ic">${ic(r.g === "Libros electrónicos" ? "book" : "doc", 20)}</span>
      <span style="min-width:0"><span class="file-name" style="display:block">${r.n}</span><span class="file-meta">${r.d}</span></span>
      <span class="chev">${ic("ext", 20)}</span>
    </button>`;
}
function biblioResultados() {
  const q = biblioQ.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const norm = t => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  if (q) {
    const hits = BIBLIO.filter(r => norm(r.n + " " + r.d + " " + r.g).includes(q));
    return hits.length ? `<div class="card list">${hits.map(biblioRow).join("")}</div>`
      : `<div class="card"><p class="empty">No hay recursos con «${esc(biblioQ.trim())}». Prueba con «libros», «artículos» o el nombre de un área.</p></div>`;
  }
  const grupos = ["Artículos científicos", "Libros electrónicos", "Por área"];
  return `
    <p class="day-head">Recomendados para Ingeniería en Energía</p>
    <div class="card list">${BIBLIO.filter(r => r.rec).map(biblioRow).join("")}</div>
    ${grupos.map(g => {
      const items = BIBLIO.filter(r => r.g === g && !r.rec);
      return items.length ? `<p class="day-head">${g}</p><div class="card list">${items.map(biblioRow).join("")}</div>` : "";
    }).join("")}`;
}

  if ((m = h.match(/^notas-([1-5])$/))) return { v: "notasm", c: m[1], nav: "notas" };

  if ((m = h.match(/^tarea-(t\d+)$/)) && TAREAS[m[1]]) return { v: "tarea", id: m[1], nav: "cursos" };

/* ---------- Modo exposición ---------- */
const expoToggle = document.getElementById("expo-toggle");
function applyExpo() {
  const on = expoToggle.checked;
  document.body.classList.toggle("expo", on);
  document.querySelectorAll(".hbadge").forEach(b => b.remove());
  if (!on) return;
  document.querySelectorAll("[data-h]").forEach(el => {
    const codes = el.dataset.h.split(",");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "hbadge";
    b.textContent = codes.join(" · ");
    b.setAttribute("aria-label", "Hallazgos que resuelve: " + codes.join(", "));
    b.addEventListener("click", ev => {
      ev.preventDefault(); ev.stopPropagation();
      openSheet("Qué resuelve", codes.map(c => {
        const h = H[c];
        if (!h) return "";
        return `<article class="finding"><span class="finding-code">${c}</span><h3>${h.t}</h3>
          <dl><dt>Antes</dt><dd>${h.antes}</dd><dt>En el prototipo</dt><dd>${h.ahora}</dd><dt>Criterio</dt><dd>${h.cr}</dd></dl></article>`;
      }).join(""));
    });
    el.appendChild(b);
  });
}
try { expoToggle.checked = localStorage.getItem("miucb-expo") === "1"; } catch (e) {}
expoToggle.addEventListener("change", () => {
  try { localStorage.setItem("miucb-expo", expoToggle.checked ? "1" : "0"); } catch (e) {}
  applyExpo();
  toast(expoToggle.checked ? "Modo exposición: toca una etiqueta para ver el hallazgo que resuelve." : "Modo exposición desactivado.");
});

const temaBtn = document.getElementById("btn-tema");
const temaActual = () => document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function pintarTema() {
  const dark = temaActual() === "dark";
  temaBtn.innerHTML = ic(dark ? "moon" : "sun");
  temaBtn.setAttribute("aria-label", dark ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
}
try { const t = localStorage.getItem("miucb-tema"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
temaBtn.addEventListener("click", () => {
  const next = temaActual() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("miucb-tema", next); } catch (e) {}
  pintarTema();
});
paintIcons();
pintarTema();
render();
</script>
